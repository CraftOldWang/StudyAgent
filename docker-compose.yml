name: study-agent

services:
  mysql:
    image: mysql:8.1
    container_name: study-agent-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: study_agent
      MYSQL_USER: study
      MYSQL_PASSWORD: study123
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - study-agent-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: study-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - study-agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: study-agent-es
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - study-agent-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: study-agent-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - study-agent-net

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: study-agent-rocketmq-namesrv
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: -Xms256m -Xmx256m
    ports:
      - "9876:9876"
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - study-agent-net

  rocketmq-init:
    image: apache/rocketmq:5.3.2
    container_name: study-agent-rocketmq-init
    user: root
    command: sh -c "mkdir -p /home/rocketmq/logs /home/rocketmq/store && chown -R 3000:3000 /home/rocketmq/logs /home/rocketmq/store"
    volumes:
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    networks:
      - study-agent-net

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: study-agent-rocketmq-broker
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf
    environment:
      JAVA_OPT_EXT: -server -Xms512m -Xmx512m -Xmn256m
      NAMESRV_ADDR: rocketmq-namesrv:9876
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf
      - rocketmq-broker-store:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    depends_on:
      rocketmq-init:
        condition: service_completed_successfully
      rocketmq-namesrv:
        condition: service_started
    networks:
      - study-agent-net

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: study-agent-rocketmq-dashboard
    environment:
      JAVA_OPTS: -Drocketmq.namesrv.addr=rocketmq-namesrv:9876
    ports:
      - "8088:8082"
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    networks:
      - study-agent-net

  rustfs:
    image: rustfs/rustfs:latest
    container_name: study-agent-rustfs
    environment:
      RUSTFS_ACCESS_KEY: study
      RUSTFS_SECRET_KEY: study123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - study-agent-net

volumes:
  mysql-data:
  redis-data:
  es-data:
  rocketmq-namesrv-logs:
  rocketmq-broker-store:
  rocketmq-broker-logs:
  rustfs-data:

networks:
  study-agent-net:
    driver: bridge
