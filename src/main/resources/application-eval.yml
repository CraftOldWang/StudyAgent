spring:
  datasource:
    url: jdbc:mysql://${EVAL_MYSQL_HOST:localhost}:${EVAL_MYSQL_PORT:3307}/study_agent_eval?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
  data:
    redis:
      database: 1

study-agent:
  agentscope:
    workspace: ${user.dir}/.eval/agentscope
    model:
      primary-model-id: deepseek:${study-agent.ai.chat.model}
  ai:
    chat:
      model: deepseek-v4-flash
    embedding:
      model: qwen3.7-text-embedding
  object-storage:
    bucket: study-agent-eval
  elasticsearch:
    physical-index: eval-qwen37-1024-baseline-v1
    read-alias: eval-qwen37-1024-baseline-read
    write-alias: eval-qwen37-1024-baseline-write
  rocketmq:
    document-topic: study-agent-eval-document
    document-consumer-group: study-agent-eval-document-consumer
  canal:
    enabled: false
