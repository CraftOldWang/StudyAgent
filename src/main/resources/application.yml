server:
  port: 8080

spring:
  application:
    name: study-agent
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/study_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: study
    password: study123
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: localhost:9876
  producer:
    group: study-agent-producer

study-agent:
  object-storage:
    endpoint: http://localhost:9000
    access-key: study
    secret-key: study123456
    bucket: study-agent
    region: us-east-1
    path-style-access: true
  elasticsearch:
    endpoint: http://localhost:9200
    chunk-index: study-agent-chunks
    vector-dimensions: 384
  rag:
    top-k: 6
    chunk-size: 900
    chunk-overlap: 120
  rocketmq:
    document-topic: study-agent-document
    document-consumer-group: study-agent-document-consumer
