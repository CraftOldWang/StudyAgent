server:
  port: 8080

spring:
  application:
    name: study-agent
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/study_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: study
    password: study123
  data:
    redis:
      host: localhost
      port: 6380
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  ai:
    dashscope:
      chat:
        enabled: false
      embedding:
        enabled: false
      api-key: ${AI_DASHSCOPE_API_KEY:sk-7ef2b4dacb134c41ac7feee0319ee673}
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

rocketmq:
  name-server: localhost:9876
  producer:
    group: study-agent-producer

study-agent:
  object-storage:
    endpoint: http://localhost:9000
    access-key: study
    secret-key: study123456
    bucket: study-agent
    region: us-east-1
    path-style-access: true
  elasticsearch:
    endpoint: http://localhost:9200
    chunk-index: study-agent-chunks
    vector-dimensions: 1024
  rag:
    top-k: 6
    chunk-size: 900
    chunk-overlap: 120
    bm25-candidate-size: 30
    vector-candidate-size: 30
    rrf-k: 60
    parent-before: 1
    parent-after: 1
  ai:
    embedding:
      provider: dashscope
      model: text-embedding-v3
      dimensions: 1024
      api-key: ${AI_DASHSCOPE_API_KEY:sk-7ef2b4dacb134c41ac7feee0319ee673}
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com}
      text-type: document
    chat:
      provider: deepseek
      model: deepseek-chat
      api-key: ${DEEPSEEK_API_KEY:sk-c95b6007698c46b5be295e3bbe2b7421}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      temperature: 0.2
      max-tokens: 1800
  rocketmq:
    document-topic: study-agent-document
    document-consumer-group: study-agent-document-consumer


