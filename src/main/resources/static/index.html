<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyAgent RAG</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1e252e;
      --muted: #697586;
      --line: #d8dee8;
      --primary: #246bfe;
      --primary-dark: #174ebd;
      --ok: #16875d;
      --warn: #a06000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .shell {
      display: grid;
      grid-template-columns: 340px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      border-right: 1px solid var(--line);
      background: #fbfcfe;
      padding: 24px;
    }

    main {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 6px;
      letter-spacing: 0;
    }

    h2 {
      font-size: 15px;
      margin: 0 0 12px;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: #354052;
      font-weight: 600;
    }

    input[type="file"],
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      border-radius: 6px;
      padding: 10px 11px;
      font: inherit;
    }

    textarea {
      min-height: 92px;
      resize: vertical;
    }

    button {
      border: 0;
      background: var(--primary);
      color: white;
      border-radius: 6px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
      min-height: 40px;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status {
      min-height: 22px;
      font-size: 13px;
      color: var(--muted);
      white-space: pre-wrap;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.warn {
      color: var(--warn);
    }

    .answer {
      white-space: pre-wrap;
      line-height: 1.7;
      font-size: 15px;
    }

    .refs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }

    .ref {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fbfcfe;
    }

    .ref strong {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .ref p {
      color: #3b4656;
      font-size: 13px;
      max-height: 180px;
      overflow: auto;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      background: #ffffff;
    }

    @media (max-width: 780px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
    }
  </style>
</head>
<body>
<div class="shell">
  <aside class="stack">
    <div>
      <h1>StudyAgent RAG</h1>
      <p>上传资料后等待几秒，让 RocketMQ 消费者完成解析、切块、向量化和 Elasticsearch 入库，再提问验证检索结果。</p>
    </div>

    <section class="panel stack">
      <h2>知识库</h2>
      <div id="kbStatus" class="status">正在加载默认知识库...</div>
    </section>

    <section class="panel stack">
      <h2>上传资料</h2>
      <label>
        文件
        <input id="fileInput" type="file">
      </label>
      <button id="uploadBtn">上传并入库</button>
      <div id="uploadStatus" class="status"></div>
    </section>
  </aside>

  <main>
    <section class="panel stack">
      <h2>RAG Chat</h2>
      <label>
        问题
        <textarea id="questionInput" placeholder="例如：这份资料主要讲了什么？"></textarea>
      </label>
      <button id="askBtn">检索并回答</button>
      <div id="chatStatus" class="status"></div>
    </section>

    <section class="panel stack">
      <h2>回答</h2>
      <div id="answer" class="answer">还没有提问。</div>
    </section>

    <section class="panel stack">
      <h2>引用片段</h2>
      <div id="references" class="refs"></div>
    </section>
  </main>
</div>

<script>
  const state = {
    knowledgeBaseId: null
  };

  const kbStatus = document.querySelector('#kbStatus');
  const uploadStatus = document.querySelector('#uploadStatus');
  const chatStatus = document.querySelector('#chatStatus');
  const answer = document.querySelector('#answer');
  const references = document.querySelector('#references');

  async function api(url, options) {
    const response = await fetch(url, options);
    const payload = await response.json();
    if (!response.ok || payload.code !== 0) {
      throw new Error(payload.message || '请求失败');
    }
    return payload.data;
  }

  async function loadDefaultKnowledgeBase() {
    const kb = await api('/api/knowledge-bases/default');
    state.knowledgeBaseId = kb.id;
    kbStatus.textContent = `默认知识库：${kb.name}（ID ${kb.id}）`;
    kbStatus.className = 'status ok';
  }

  document.querySelector('#uploadBtn').addEventListener('click', async () => {
    const file = document.querySelector('#fileInput').files[0];
    if (!file) {
      uploadStatus.textContent = '请先选择文件。';
      uploadStatus.className = 'status warn';
      return;
    }
    if (!state.knowledgeBaseId) {
      uploadStatus.textContent = '默认知识库还未加载完成。';
      uploadStatus.className = 'status warn';
      return;
    }

    const form = new FormData();
    form.append('knowledgeBaseId', state.knowledgeBaseId);
    form.append('file', file);
    uploadStatus.textContent = '正在上传，随后会通过 RocketMQ 异步处理文档...';
    uploadStatus.className = 'status';

    try {
      const result = await api('/api/files/upload', {
        method: 'POST',
        body: form
      });
      uploadStatus.textContent = `上传完成：fileId=${result.fileId}, documentId=${result.documentId}, status=${result.status}\n请等待 3-10 秒后提问。`;
      uploadStatus.className = 'status ok';
    } catch (error) {
      uploadStatus.textContent = error.message;
      uploadStatus.className = 'status warn';
    }
  });

  document.querySelector('#askBtn').addEventListener('click', async () => {
    const question = document.querySelector('#questionInput').value.trim();
    if (!question) {
      chatStatus.textContent = '请输入问题。';
      chatStatus.className = 'status warn';
      return;
    }

    chatStatus.textContent = '正在检索向量索引...';
    chatStatus.className = 'status';
    answer.textContent = '';
    references.innerHTML = '';

    try {
      const result = await api('/api/chat/rag', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          knowledgeBaseId: state.knowledgeBaseId,
          question
        })
      });
      answer.textContent = result.answer;
      references.innerHTML = result.references.map((ref, index) => `
        <article class="ref">
          <strong>引用 ${index + 1}</strong>
          <p>${escapeHtml(ref.content)}</p>
          <div class="meta">
            <span class="pill">chunk ${ref.chunkId}</span>
            <span class="pill">doc ${ref.documentId}</span>
            <span class="pill">score ${Number(ref.score).toFixed(4)}</span>
          </div>
        </article>
      `).join('');
      chatStatus.textContent = `完成，命中 ${result.references.length} 个片段。`;
      chatStatus.className = 'status ok';
    } catch (error) {
      chatStatus.textContent = error.message;
      chatStatus.className = 'status warn';
    }
  });

  function escapeHtml(value) {
    return value
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  loadDefaultKnowledgeBase().catch(error => {
    kbStatus.textContent = error.message;
    kbStatus.className = 'status warn';
  });
</script>
</body>
</html>
